# backend/ (FastAPI 서버) 검사 — backend/ 아래 파일이 바뀐 push·PR에서만 실행
# 테스트는 실제 PostgreSQL로 돌린다 (STACK.md). 로컬의 db-test(55432)와 같은 postgres:18
name: backend-ci

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: jeonunsi_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jeonunsi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI 전용 테스트 DB. JWT_SECRET은 conftest.py가 테스트용 값을 넣는다 (실제 키 아님)
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/jeonunsi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 의존성 설치
        run: pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -v
